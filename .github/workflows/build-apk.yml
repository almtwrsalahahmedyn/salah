name: EditorTrue APK Builder
# editortrue-apk-builder-managed:v7
# Generated by scripts/generate-workflow.mjs from workflow/build-apk.yml.tpl.
# Do not edit .github/workflows/build-apk.yml by hand: change the template.
run-name: APK build ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private release containing project.zip
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Initialize build diagnostics
        shell: bash
        run: |
          mkdir -p build-result
          {
            echo "APK builder diagnostics"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            date -u
          } | tee -a build-result/build.log
      - name: Checkout builder repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download private source archive
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p source-archive
          gh release download "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --pattern project.zip --dir source-archive
      - name: Pass archive to isolated build job
        uses: actions/upload-artifact@v5
        with:
          name: source-${{ inputs.release_tag }}
          path: source-archive/project.zip
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout builder workflow only
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download source archive
        uses: actions/download-artifact@v5
        with:
          name: source-${{ inputs.release_tag }}
          path: source-input
      - name: Install build helper scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-tools"
          mkdir -p "$GITHUB_WORKSPACE/build-result"
          cat > "$GITHUB_WORKSPACE/build-tools/detect_project.py" <<'PY'
          #!/usr/bin/env python3
          """Detect the Android build system inside an extracted source archive.

          This file is the single source of truth for project detection. It is embedded
          verbatim into ``.github/workflows/build-apk.yml`` by
          ``scripts/generate-workflow.mjs``; edit it here and regenerate, never inside the
          generated workflow.

          The script prints a human readable report to stdout, appends the same report to
          ``<result-dir>/build.log``, and writes every detected value to ``$GITHUB_OUTPUT``
          so later workflow steps can use them.
          """

          from __future__ import annotations

          import argparse
          import json
          import os
          import pathlib
          import re
          import sys

          # Directories that never hold the project we want to build: build outputs,
          # dependency caches and editor metadata.
          SKIP_DIRS = {
              ".git",
              ".gradle",
              ".idea",
              ".kotlin",
              ".cxx",
              ".dart_tool",
              ".next",
              ".nuxt",
              ".pub-cache",
              ".venv",
              ".vscode",
              "__pycache__",
              "Pods",
              "build",
              "dist",
              "node_modules",
              "out",
              "target",
              "venv",
          }

          FLUTTER_FALLBACK_VERSION = "3.7.12"
          DEFAULT_ANDROID_API = 35
          DEFAULT_GRADLE_VERSION = "8.9"
          DEFAULT_NODE_VERSION = "22"

          # Minimum Gradle release that each Android Gradle Plugin generation needs.
          AGP_TO_GRADLE = [
              ((8, 13), "8.13"),
              ((8, 12), "8.13"),
              ((8, 11), "8.13"),
              ((8, 10), "8.11.1"),
              ((8, 9), "8.11.1"),
              ((8, 8), "8.10.2"),
              ((8, 7), "8.9"),
              ((8, 6), "8.7"),
              ((8, 5), "8.7"),
              ((8, 4), "8.6"),
              ((8, 3), "8.4"),
              ((8, 2), "8.2"),
              ((8, 1), "8.0"),
              ((8, 0), "8.0"),
              ((7, 4), "7.5"),
              ((7, 3), "7.4"),
              ((7, 0), "7.0.2"),
              ((4, 2), "6.7.1"),
          ]

          GRADLE_FILE_NAMES = {
              "build.gradle",
              "build.gradle.kts",
              "settings.gradle",
              "settings.gradle.kts",
              "gradle.properties",
              "libs.versions.toml",
          }


          def read_text(path: pathlib.Path, limit: int = 400_000) -> str:
              try:
                  return path.read_text(errors="replace")[:limit]
              except OSError:
                  return ""


          def walk(root: pathlib.Path, names):
              """Yield files called *names* below *root*, skipping build and cache trees."""
              wanted = {names} if isinstance(names, str) else set(names)
              patterns = {name for name in wanted if "*" in name}
              plain = wanted - patterns
              for current, directories, files in os.walk(root):
                  directories[:] = sorted(
                      name for name in directories if name not in SKIP_DIRS
                  )
                  current_path = pathlib.Path(current)
                  for name in sorted(files):
                      if name in plain or any(
                          pathlib.PurePath(name).match(pattern) for pattern in patterns
                      ):
                          yield current_path / name


          def parse_json(path: pathlib.Path):
              try:
                  value = json.loads(read_text(path))
              except (OSError, json.JSONDecodeError):
                  return None
              return value if isinstance(value, dict) else None


          def version_tuple(value: str | None):
              if not value:
                  return None
              parts = re.findall(r"\d+", value)
              if not parts:
                  return None
              return tuple(int(part) for part in parts[:3])


          def detect_candidates(root: pathlib.Path):
              candidates: dict[tuple[str, str], dict] = {}

              def add(kind: str, project: pathlib.Path, score: int, note: str) -> None:
                  key = (kind, str(project))
                  if key in candidates and candidates[key]["score"] >= score:
                      return
                  candidates[key] = {
                      "kind": kind,
                      "root": project,
                      "score": score,
                      "note": note,
                  }

              # --- Dart / Flutter -----------------------------------------------------
              for pubspec in walk(root, "pubspec.yaml"):
                  text = read_text(pubspec)
                  if "flutter" not in text:
                      continue
                  project = pubspec.parent
                  score = 60
                  if (project / "android" / "gradlew").is_file():
                      score += 20
                  elif (project / "android").is_dir():
                      score += 10
                  if (project / "lib" / "main.dart").is_file():
                      score += 10
                  if (project / "example" / "pubspec.yaml").is_file() and (
                      project / "lib" / "main.dart"
                  ).is_file() is False:
                      # A Flutter package (plugin) rather than an application.
                      score -= 25
                  add("flutter", project, score, "pubspec.yaml depends on the Flutter SDK")

              # --- JavaScript families ------------------------------------------------
              for package_file in walk(root, "package.json"):
                  package = parse_json(package_file)
                  if package is None:
                      continue
                  project = package_file.parent
                  dependencies = {
                      **(package.get("dependencies") or {}),
                      **(package.get("devDependencies") or {}),
                  }
                  has_android_dir = (project / "android").is_dir()
                  has_android_wrapper = any(
                      (project / "android" / name).is_file()
                      for name in ("gradlew", "settings.gradle", "settings.gradle.kts")
                  )
                  has_expo_config = any(
                      (project / name).is_file()
                      for name in (
                          "app.json",
                          "app.config.js",
                          "app.config.ts",
                          "app.config.mjs",
                          "app.config.cjs",
                      )
                  )
                  if "expo" in dependencies and has_expo_config:
                      add(
                          "expo",
                          project,
                          55 + (20 if has_android_wrapper else 0),
                          "package.json depends on Expo and the app has an Expo config",
                      )
                  if "react-native" in dependencies and (has_android_wrapper or has_android_dir):
                      add(
                          "react-native",
                          project,
                          50 + (15 if has_android_wrapper else 0),
                          "React Native CLI app with an android/ project",
                      )
                  if {"@capacitor/android", "@capacitor/cli", "@capacitor/core"} & set(
                      dependencies
                  ):
                      add(
                          "capacitor",
                          project,
                          45 + (15 if has_android_dir else 0),
                          "Capacitor app",
                      )
                  if "cordova" in dependencies or (project / "config.xml").is_file():
                      add(
                          "cordova",
                          project,
                          40 + (10 if (project / "config.xml").is_file() else 0),
                          "Apache Cordova app",
                      )
                  if {"@nativescript/core", "nativescript", "@nativescript/android"} & set(
                      dependencies
                  ):
                      add("nativescript", project, 45, "NativeScript app")
                  if {"@ionic/angular", "@ionic/react", "@ionic/vue", "ionic"} & set(
                      dependencies
                  ) and not ({"@capacitor/android"} & set(dependencies)):
                      add(
                          "ionic",
                          project,
                          38,
                          "Ionic web app that needs a Capacitor Android host",
                      )

              # --- .NET / MAUI --------------------------------------------------------
              for project_file in walk(root, ["*.csproj", "*.fsproj"]):
                  text = read_text(project_file)
                  looks_android = bool(
                      re.search(r"<TargetFrameworks?>[^<]*-android", text, re.I)
                      or re.search(r"<UseMaui>\s*true\s*</UseMaui>", text, re.I)
                      or re.search(r"<AndroidApplication>\s*true\s*</AndroidApplication>", text, re.I)
                  )
                  if looks_android:
                      add(
                          "dotnet-android",
                          project_file.parent,
                          60,
                          ".NET Android / MAUI project file",
                      )

              # --- Maven --------------------------------------------------------------
              for pom in walk(root, "pom.xml"):
                  text = read_text(pom)
                  if "android-maven-plugin" in text or re.search(
                      r"<packaging>\s*apk\s*</packaging>", text, re.I
                  ):
                      add("maven-android", pom.parent, 55, "Maven Android project (pom.xml)")

              # --- Gradle / Kotlin Multiplatform -------------------------------------
              settings_files = list(walk(root, ["settings.gradle", "settings.gradle.kts"]))
              settings_roots = {str(path.parent) for path in settings_files}
              for settings in settings_files:
                  project = settings.parent
                  text = read_text(settings)
                  score = 45
                  if (project / "gradlew").is_file():
                      score += 20
                  if re.search(
                      r"com\.android\.(application|library|dynamic-feature)"
                      r"|unityLibrary|multiplatform|org\.jetbrains\.kotlin\.multiplatform",
                      text,
                  ) or any(
                      (project / module / "build.gradle").is_file()
                      or (project / module / "build.gradle.kts").is_file()
                      for module in ("app", "composeApp", "androidApp", "mobile")
                  ):
                      score += 15
                  add("android", project, score, "Gradle settings file")
              for wrapper in walk(root, "gradlew"):
                  project = wrapper.parent
                  if str(project) in settings_roots:
                      continue
                  add(
                      "android",
                      project,
                      35,
                      "Gradle wrapper without a settings file (single-module project)",
                  )
              for build_file in walk(root, ["build.gradle", "build.gradle.kts"]):
                  project = build_file.parent
                  if str(project) in settings_roots:
                      continue
                  text = read_text(build_file)
                  if re.search(r"com\.android\.(application|library)", text):
                      add(
                          "android",
                          project,
                          30,
                          "Android Gradle build file without a settings file",
                      )

              # --- Legacy ADT / Eclipse ----------------------------------------------
              for manifest in walk(root, "AndroidManifest.xml"):
                  project = manifest.parent
                  text = read_text(manifest)
                  has_gradle = any(
                      (project / name).exists()
                      for name in ("build.gradle", "build.gradle.kts", "settings.gradle")
                  )
                  if has_gradle or "package=" not in text:
                      continue
                  add(
                      "adt",
                      project,
                      32,
                      "AndroidManifest.xml with no Gradle files (legacy ADT layout)",
                  )

              # --- Python Android toolchains -----------------------------------------
              for spec in walk(root, "buildozer.spec"):
                  add("kivy", spec.parent, 55, "Kivy/Buildozer project (buildozer.spec)")
              for pyproject in walk(root, "pyproject.toml"):
                  text = read_text(pyproject)
                  if "[tool.briefcase]" in text:
                      add("beeware", pyproject.parent, 50, "BeeWare/Briefcase project")

              # --- Bazel --------------------------------------------------------------
              for workspace in walk(
                  root, ["WORKSPACE", "WORKSPACE.bazel", "MODULE.bazel"]
              ):
                  add("bazel", workspace.parent, 36, "Bazel workspace")
              for build_file in walk(root, ["BUILD", "BUILD.bazel"]):
                  text = read_text(build_file)
                  if re.search(r"android_binary|android_library", text):
                      add("bazel", build_file.parent, 38, "Bazel android_binary target")

              # --- Engine projects that must be exported before they can be built ----
              for version_file in walk(root, "ProjectVersion.txt"):
                  if (version_file.parent.parent / "Assets").is_dir():
                      add(
                          "unity-source",
                          version_file.parent.parent,
                          22,
                          "Unity editor project (Assets/ + ProjectSettings/)",
                      )
              for godot_file in walk(root, "project.godot"):
                  add(
                      "godot-source",
                      godot_file.parent,
                      22,
                      "Godot editor project (project.godot)",
                  )
              for unreal_file in walk(root, "*.uproject"):
                  add(
                      "unreal-source",
                      unreal_file.parent,
                      22,
                      "Unreal Engine project (*.uproject)",
                  )

              return sorted(
                  candidates.values(),
                  key=lambda item: (
                      -item["score"],
                      len(item["root"].parts),
                      str(item["root"]),
                  ),
              )


          def gradle_texts(project: pathlib.Path):
              for path in walk(project, GRADLE_FILE_NAMES):
                  yield path, read_text(path)


          def detect_agp(project: pathlib.Path):
              patterns = (
                  r"com\.android\.tools\.build:gradle:(\d+\.\d+(?:\.\d+)?)",
                  r"com\.android\.(?:application|library)['\"]?\s*\)?\s*version\s*['\"]?(\d+\.\d+(?:\.\d+)?)",
                  r"^\s*agp\s*=\s*[\"'](\d+\.\d+(?:\.\d+)?)[\"']",
                  r"^\s*androidGradlePlugin\s*=\s*[\"'](\d+\.\d+(?:\.\d+)?)[\"']",
                  r"classpath\s*\(\s*[\"']com\.android\.tools\.build:gradle:(\d+\.\d+(?:\.\d+)?)[\"']",
              )
              for _path, text in gradle_texts(project):
                  for pattern in patterns:
                      match = re.search(pattern, text, re.M)
                      if match:
                          return version_tuple(match.group(1))
              return None


          def detect_wrapper_gradle(project: pathlib.Path):
              for wrapper in walk(project, "gradle-wrapper.properties"):
                  match = re.search(
                      r"gradle-(\d+\.\d+(?:\.\d+)?)-(?:bin|all)\.zip", read_text(wrapper)
                  )
                  if match:
                      return match.group(1)
              return None


          def detect_toolchain_java(project: pathlib.Path):
              for _path, text in gradle_texts(project):
                  match = re.search(r"JavaLanguageVersion\.of\(\s*(\d{2})\s*\)", text)
                  if match:
                      return int(match.group(1))
                  match = re.search(
                      r"jvmToolchain\(\s*(\d{2})\s*\)|languageVersion\s*=\s*JavaLanguageVersion\.of\(\s*(\d{2})",
                      text,
                  )
                  if match:
                      return int(match.group(1) or match.group(2))
              return None


          def detect_android_api(project: pathlib.Path):
              apis = set()
              patterns = (
                  r"compileSdk(?:Version)?\s*=\s*(\d{2})",
                  r"compileSdk(?:Version)?\s+(\d{2})\b",
                  r"android\.compileSdk\s*=\s*(\d{2})",
                  r"compileSdkVersion\s*=\s*(\d{2})",
                  r"compileSdk\s*=\s*\"(\d{2})\"",
                  r"targetSdk(?:Version)?\s*=\s*(\d{2})",
              )
              for _path, text in gradle_texts(project):
                  for pattern in patterns:
                      for value in re.findall(pattern, text):
                          try:
                              apis.add(int(value))
                          except ValueError:
                              continue
              return max(apis) if apis else None


          def detect_ndk(project: pathlib.Path):
              for _path, text in gradle_texts(project):
                  match = re.search(
                      r"ndkVersion\s*(?:=\s*)?[\"']([\d.]+)[\"']|android\.ndkVersion\s*=\s*([\d.]+)",
                      text,
                  )
                  if match:
                      return (match.group(1) or match.group(2)).strip()
              return None


          def gradle_for_agp(agp):
              if agp is None:
                  return DEFAULT_GRADLE_VERSION
              for minimum, gradle in AGP_TO_GRADLE:
                  if agp[:2] >= minimum:
                      return gradle
              return "6.7.1"


          def java_for(agp, gradle_version: str, toolchain, kind: str) -> str:
              if toolchain and 8 <= toolchain <= 21:
                  return str(max(toolchain, 11))
              if kind == "expo":
                  return "21"
              if agp is not None and agp < (7, 0):
                  return "11"
              gradle = version_tuple(gradle_version)
              if gradle and gradle >= (8, 7) and (agp is None or agp >= (8, 5)):
                  return "21"
              return "17"


          def flutter_pin(project: pathlib.Path) -> str:
              """Pin an older Flutter release only when the project needs Dart 2."""
              text = read_text(project / "pubspec.yaml")
              match = re.search(
                  r"environment\s*:\s*\n(?:\s+\w+:[^\n]*\n)*?\s+sdk\s*:\s*['\"]?[>=\s]*(\d+)\.(\d+)",
                  text,
              )
              if not match:
                  match = re.search(r"sdk\s*:\s*['\"]?[>=\s]*(\d+)\.(\d+)", text)
              if match and int(match.group(1)) < 3:
                  return FLUTTER_FALLBACK_VERSION
              return ""


          def node_major(project: pathlib.Path) -> str:
              package = parse_json(project / "package.json")
              if not package:
                  return DEFAULT_NODE_VERSION
              engines = package.get("engines") or {}
              if not isinstance(engines, dict):
                  return DEFAULT_NODE_VERSION
              match = re.search(r"(\d{2})", str(engines.get("node", "")))
              if match and int(match.group(1)) > int(DEFAULT_NODE_VERSION):
                  return match.group(1)
              return DEFAULT_NODE_VERSION


          def dotnet_targets(project: pathlib.Path):
              for project_file in sorted(project.glob("*.*proj")):
                  text = read_text(project_file)
                  match = re.search(r"net(\d+)\.0-android", text, re.I)
                  if match:
                      major = match.group(1)
                      return f"net{major}.0-android", f"{major}.0.x"
              return "", ""


          def build_report(best: dict, outputs: dict) -> str:
              lines = [
                  "Project detection report",
                  f"  type: {outputs['project_type']}",
                  f"  root: {outputs['project_root']}",
                  f"  reason: {best['note']}",
                  f"  android api: {outputs['android_api']}",
                  f"  java: {outputs['java_version']}",
                  f"  gradle: {outputs['gradle_version']}",
              ]
              if outputs["ndk_version"]:
                  lines.append(f"  ndk: {outputs['ndk_version']}")
              if outputs["flutter_version"]:
                  lines.append(f"  flutter pin: {outputs['flutter_version']}")
              if outputs["dotnet_tfm"]:
                  lines.append(f"  dotnet: {outputs['dotnet_tfm']}")
              if best["kind"] in {"unity-source", "godot-source", "unreal-source"}:
                  lines.extend(
                      [
                          "",
                          "This archive is an engine editor project, not a buildable Android",
                          "project. Export it to an Android Gradle project first:",
                          "  Unity   : File > Build Settings > Android > Export Project, then ZIP",
                          "            the exported folder (it contains settings.gradle).",
                          "  Godot   : Project > Install Android Build Template, then",
                          "            Project > Export > Android (Gradle build), then ZIP the",
                          "            generated android/build folder next to the project.",
                          "  Unreal  : Package for Android with the Android SDK installed, then",
                          "            ZIP the generated Gradle project.",
                      ]
                  )
              return "\n".join(lines) + "\n"


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--root", default="project-source")
              parser.add_argument("--result-dir", default="build-result")
              arguments = parser.parse_args()

              root = pathlib.Path(arguments.root).resolve()
              result_dir = pathlib.Path(arguments.result_dir)
              result_dir.mkdir(parents=True, exist_ok=True)

              candidates = detect_candidates(root)
              if not candidates:
                  report = (
                      "No supported Android build system was found in this archive.\n"
                      "Supported inputs: Flutter, Expo, React Native, Capacitor, Ionic,\n"
                      "Cordova, NativeScript, Android Gradle (Java/Kotlin/KMP), legacy ADT\n"
                      "projects, Maven Android, .NET Android/MAUI, Kivy/Buildozer,\n"
                      "BeeWare/Briefcase and Bazel Android.\n"
                      "Unity, Godot and Unreal must be exported to an Android Gradle\n"
                      "project before uploading.\n"
                  )
                  print(report)
                  with open(result_dir / "build.log", "a", encoding="utf-8") as log:
                      log.write(report)
                  return 1

              best = candidates[0]
              project = pathlib.Path(best["root"])
              kind = best["kind"]

              agp = detect_agp(project)
              wrapper_gradle = detect_wrapper_gradle(project)
              required_gradle = wrapper_gradle or gradle_for_agp(agp)
              if wrapper_gradle and agp is not None:
                  needed = version_tuple(gradle_for_agp(agp))
                  current = version_tuple(wrapper_gradle)
                  if needed and current and current < needed:
                      required_gradle = gradle_for_agp(agp)

              android_api = detect_android_api(project) or DEFAULT_ANDROID_API
              android_api = max(21, min(android_api, 40))
              dotnet_tfm, dotnet_sdk = ("", "")
              if kind == "dotnet-android":
                  dotnet_tfm, dotnet_sdk = dotnet_targets(project)
                  if not dotnet_tfm:
                      report = (
                          ".NET Android project detected, but no netX.0-android\n"
                          "TargetFramework was found in its project files.\n"
                      )
                      print(report)
                      with open(result_dir / "build.log", "a", encoding="utf-8") as log:
                          log.write(report)
                      return 1

              outputs = {
                  "project_type": kind,
                  "project_root": str(project),
                  "java_version": java_for(
                      agp, required_gradle, detect_toolchain_java(project), kind
                  ),
                  "gradle_version": required_gradle,
                  "android_api": str(android_api),
                  "ndk_version": detect_ndk(project) or "",
                  "flutter_version": flutter_pin(project) if kind == "flutter" else "",
                  "node_version": node_major(project),
                  "dotnet_tfm": dotnet_tfm,
                  "dotnet_sdk": dotnet_sdk,
                  "detection_score": str(best["score"]),
              }

              report = build_report(best, outputs)
              print(report, flush=True)
              with open(result_dir / "build.log", "a", encoding="utf-8") as log:
                  log.write(report + "\n")
              (result_dir / "project-type.txt").write_text(kind + "\n", encoding="utf-8")

              github_output = os.environ.get("GITHUB_OUTPUT")
              if github_output:
                  with open(github_output, "a", encoding="utf-8") as out:
                      for key, value in outputs.items():
                          if "\n" in value or "\r" in value:
                              value = value.replace("\r", " ").replace("\n", " ")
                          out.write(f"{key}={value}\n")
              else:
                  for key, value in outputs.items():
                      print(f"{key}={value}")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          cat > "$GITHUB_WORKSPACE/build-tools/try-build.sh" <<'SH'
          #!/usr/bin/env bash
          # Runs build attempts in order and stops at the first success.
          # Usage: try-build.sh "<label>" "<command>" ["<command>" ...]
          set -uo pipefail
          LOG="${BUILD_LOG:-$GITHUB_WORKSPACE/build-result/build.log}"
          label="$1"
          shift
          if [ "$#" -eq 0 ]; then
            echo "try-build: no command supplied for $label" | tee -a "$LOG" >&2
            exit 2
          fi
          total="$#"
          attempt=0
          set -o pipefail
          for command in "$@"; do
            attempt=$((attempt + 1))
            {
              echo ""
              echo "=== [$label] attempt $attempt/$total: $command"
            } >> "$LOG"
            if bash -c "$command" 2>&1 | tee -a "$LOG"; then
              echo "=== [$label] attempt $attempt succeeded: $command" | tee -a "$LOG"
              printf '%s\t%s\n' "$label" "$command" >> "$GITHUB_WORKSPACE/build-result/successful-attempts.txt"
              exit 0
            fi
            echo "=== [$label] attempt $attempt failed: $command" | tee -a "$LOG"
          done
          echo "=== [$label] every attempt failed; the first error above is the real cause." | tee -a "$LOG"
          exit 1
          SH
          chmod +x "$GITHUB_WORKSPACE/build-tools/try-build.sh"
          python3 -m py_compile "$GITHUB_WORKSPACE/build-tools/detect_project.py"
          echo "Build helper scripts are ready." | tee -a "$GITHUB_WORKSPACE/build-result/build.log"
      - name: Safely extract project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-result"
          python3 - <<'PY' 2>&1 | tee -a "$GITHUB_WORKSPACE/build-result/build.log"
          import pathlib, shutil, stat, zipfile
          archive = pathlib.Path("source-input/project.zip")
          root = pathlib.Path("project-source").resolve()
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()
              if len(entries) > 100000:
                  raise SystemExit("ZIP contains too many entries (limit: 100000)")
              expanded_bytes = sum(info.file_size for info in entries)
              if expanded_bytes > 8 * 1024 * 1024 * 1024:
                  raise SystemExit("Expanded ZIP exceeds the 8 GiB build limit")
              safe_entries = []
              for info in entries:
                  # Some Windows ZIP tools store UTF-8 bytes without setting bit 11.
                  # zipfile then decodes those bytes as CP437; recover valid UTF-8 per entry.
                  filename = info.filename
                  try:
                      filename = filename.encode("cp437").decode("utf-8")
                  except (UnicodeEncodeError, UnicodeDecodeError):
                      pass
                  name = filename.replace("\\", "/")
                  rel = pathlib.PurePosixPath(name)
                  if rel.is_absolute() or ".." in rel.parts or not rel.parts:
                      raise SystemExit("Unsafe path found in ZIP: " + filename[:180])
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit("Symbolic links are not accepted in project ZIPs")
                  target = (root / pathlib.Path(*rel.parts)).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit("ZIP entry escaped the extraction directory")
                  safe_entries.append((info, target, name.endswith("/")))
              for info, target, is_directory in safe_entries:
                  if is_directory:
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as source, target.open("wb") as destination:
                          shutil.copyfileobj(source, destination)
          print("Archive extracted into project-source.")
          PY
      - name: Identify project type and toolchain
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/build-tools/detect_project.py" \
            --root "$GITHUB_WORKSPACE/project-source" \
            --result-dir "$GITHUB_WORKSPACE/build-result" 2>&1 | tee -a "$GITHUB_WORKSPACE/build-result/build.log"
      - name: Configure Android SDK from hosted runner
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          SDK_ROOT=""
          for candidate_root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            if [ -n "$candidate_root" ] && [ -d "$candidate_root/cmdline-tools" ]; then
              SDK_ROOT="$candidate_root"
              break
            fi
          done
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK command-line tools were not found on this GitHub runner." | tee -a "$LOG"
            exit 1
          fi
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT/cmdline-tools." | tee -a "$LOG"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT with $("$SDKMANAGER" --version | head -n 1)." | tee -a "$LOG"
      - name: Install missing Android SDK components
        shell: bash
        env:
          PROJECT_TYPE: ${{ steps.inspect.outputs.project_type }}
          ANDROID_API: ${{ steps.inspect.outputs.android_api }}
          NDK_VERSION: ${{ steps.inspect.outputs.ndk_version }}
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          case "$PROJECT_TYPE" in
            dotnet-android|kivy|beeware|unity-source|godot-source|unreal-source)
              echo "Skipping Android SDK provisioning for $PROJECT_TYPE; its toolchain installs what it needs." | tee -a "$LOG"
              exit 0
              ;;
          esac
          install_packages() {
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if sdkmanager "$@" >>"$LOG" 2>&1; then return 0; fi
              echo "sdkmanager failed for $* (attempt $attempt of 3); retrying." | tee -a "$LOG"
              attempt=$((attempt + 1))
              sleep 5
            done
            return 1
          }
          {
            echo "Accepting Android SDK licenses."
            printf 'y\n%.0s' {1..100} | sdkmanager --licenses >/dev/null 2>&1 || true
            if ! available_packages="$(sdkmanager --list 2>&1)"; then
              printf '%s\n' "$available_packages" | tee -a "$LOG"
              echo "Could not query available Android SDK packages." | tee -a "$LOG"
              exit 1
            fi
            api="$ANDROID_API"
            sdk_platform=""
            while [ "$api" -ge 30 ]; do
              for candidate in "platforms;android-$api" "platforms;android-$api.0"; do
                if grep -Fq "$candidate " <<< "$available_packages"; then
                  sdk_platform="$candidate"
                  break
                fi
              done
              if [ -n "$sdk_platform" ]; then break; fi
              echo "Android platform API $api is not offered by this runner; trying API $((api - 1))."
              api=$((api - 1))
            done
            if [ -z "$sdk_platform" ]; then
              sdk_platform="$(grep -oE 'platforms;android-[0-9]+(\.[0-9]+)?' <<< "$available_packages" | sort -V | tail -n 1)"
            fi
            if [ -z "$sdk_platform" ]; then
              echo "No Android platform package is available on this runner." | tee -a "$LOG"
              exit 1
            fi
            build_tools="$(grep -oE 'build-tools;[0-9]+\.[0-9]+(\.[0-9]+)?' <<< "$available_packages" | sort -V | tail -n 1)"
            echo "Installing Android platform $sdk_platform and build-tools ${build_tools:-default}."
            install_packages "platform-tools" "$sdk_platform" || {
              echo "Could not install platform-tools or $sdk_platform." | tee -a "$LOG"
              exit 1
            }
            if [ -n "$build_tools" ]; then
              install_packages "$build_tools" || echo "Build-tools $build_tools could not be installed; Gradle will pick an installed version." | tee -a "$LOG"
            fi
            if grep -Fq "cmake;3.22.1 " <<< "$available_packages"; then
              install_packages "cmake;3.22.1" || echo "CMake install failed; continuing." | tee -a "$LOG"
            fi
            if [ -n "$NDK_VERSION" ] && grep -Fq "ndk;$NDK_VERSION" <<< "$available_packages"; then
              echo "Installing the NDK version declared by the project: $NDK_VERSION."
              install_packages "ndk;$NDK_VERSION" || echo "NDK $NDK_VERSION install failed; Gradle may download it on demand." | tee -a "$LOG"
            elif [ "$PROJECT_TYPE" = "expo" ] || [ "$PROJECT_TYPE" = "react-native" ] || [ "$PROJECT_TYPE" = "capacitor" ] || [ "$PROJECT_TYPE" = "ionic" ] || [ "$PROJECT_TYPE" = "cordova" ] || [ "$PROJECT_TYPE" = "nativescript" ]; then
              latest_ndk="$(grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' <<< "$available_packages" | sort -V | tail -n 1)"
              if [ -n "$latest_ndk" ]; then
                echo "Installing $latest_ndk for native mobile plugins."
                install_packages "$latest_ndk" || echo "NDK install failed; Gradle may download it on demand." | tee -a "$LOG"
              fi
            fi
            sdkmanager --list_installed 2>/dev/null | grep -E 'platform-tools|platforms;android-|build-tools;|ndk;' || true
          } 2>&1 | tee -a "$LOG"
      - name: Set up Java toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.inspect.outputs.java_version }}
      - name: Normalize Gradle configuration for the hosted runner
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.inspect.outputs.project_root }}
          REQUIRED_GRADLE: ${{ steps.inspect.outputs.gradle_version }}
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          patched=0
          while IFS= read -r -d '' properties_file; do
            if grep -Eq '^[[:space:]]*org\.gradle\.java\.(home|installations\.paths)[[:space:]]*=' "$properties_file"; then
              temporary_file="$properties_file.buildapk-tmp"
              sed -E '/^[[:space:]]*org\.gradle\.java\.(home|installations\.paths)[[:space:]]*=/s/^/# Ignored by APK builder CI: machine-local JDK override: /' "$properties_file" > "$temporary_file"
              mv "$temporary_file" "$properties_file"
              patched=$((patched + 1))
            fi
          done < <(find "$PROJECT_ROOT" -type f -name gradle.properties \
            -not -path '*/.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' \
            -not -path '*/node_modules/*' -not -path '*/.dart_tool/*' -print0)
          if [ "$patched" -gt 0 ]; then
            echo "Disabled machine-local Gradle JDK paths in $patched file(s); using hosted JAVA_HOME=$JAVA_HOME." | tee -a "$LOG"
          else
            echo "No machine-local Gradle JDK override found; using hosted JAVA_HOME=$JAVA_HOME." | tee -a "$LOG"
          fi
          echo "GRADLE_OPTS=-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false" >> "$GITHUB_ENV"
          # Auto-enable AndroidX if not specified
          if [ -f "$PROJECT_ROOT/gradle.properties" ]; then
            if ! grep -q "android.useAndroidX" "$PROJECT_ROOT/gradle.properties"; then
              echo "android.useAndroidX=true" >> "$PROJECT_ROOT/gradle.properties"
              echo "Auto-added android.useAndroidX=true to gradle.properties" | tee -a "$LOG"
            fi
          else
            echo "android.useAndroidX=true" > "$PROJECT_ROOT/gradle.properties"
            echo "Auto-created gradle.properties with android.useAndroidX=true" | tee -a "$LOG"
          fi
          upgraded=0
          while IFS= read -r -d '' wrapper_file; do
            current_version="$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-(bin|all)\.zip' "$wrapper_file" | head -n 1 | sed -E 's/^gradle-//; s/-(bin|all)\.zip$//')"
            if [ -z "$current_version" ] || [ -z "$REQUIRED_GRADLE" ]; then continue; fi
            lowest="$(printf '%s\n%s\n' "$REQUIRED_GRADLE" "$current_version" | sort -V | head -n 1)"
            if [ "$lowest" != "$REQUIRED_GRADLE" ]; then
              sed -E -i "s#gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-(bin|all)\.zip#gradle-${REQUIRED_GRADLE}-bin.zip#g" "$wrapper_file"
              echo "Raised the Gradle wrapper in $wrapper_file from $current_version to $REQUIRED_GRADLE so it matches the Android Gradle plugin." | tee -a "$LOG"
              upgraded=$((upgraded + 1))
            fi
          done < <(find "$PROJECT_ROOT" -type f -name gradle-wrapper.properties \
            -not -path '*/.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' \
            -not -path '*/node_modules/*' -not -path '*/.dart_tool/*' -print0)
          if [ "$upgraded" -eq 0 ]; then
            echo "Every Gradle wrapper already satisfies the detected plugin version." | tee -a "$LOG"
          fi
          while IFS= read -r -d '' wrapper_script; do
            chmod +x "$wrapper_script" 2>/dev/null || true
          done < <(find "$PROJECT_ROOT" -type f -name gradlew -not -path '*/node_modules/*' -print0)
          local_properties_written=0
          while IFS= read -r -d '' build_dir; do
            if [ -f "$build_dir/settings.gradle" ] || [ -f "$build_dir/settings.gradle.kts" ] || [ -f "$build_dir/build.gradle" ] || [ -f "$build_dir/build.gradle.kts" ]; then
              printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > "$build_dir/local.properties"
              local_properties_written=$((local_properties_written + 1))
            fi
          done < <(find "$PROJECT_ROOT" -maxdepth 3 -type d \
            -not -path '*/.git*' -not -path '*/.gradle*' -not -path '*/build/*' -not -path '*/node_modules/*' -print0)
          echo "Wrote sdk.dir into $local_properties_written Gradle project folder(s)." | tee -a "$LOG"
      - name: Ensure a usable Gradle launcher
        if: steps.inspect.outputs.project_type == 'android' || steps.inspect.outputs.project_type == 'adt'
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.inspect.outputs.project_root }}
          GRADLE_VERSION: ${{ steps.inspect.outputs.gradle_version }}
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          if [ -f "$PROJECT_ROOT/gradlew" ]; then
            chmod +x "$PROJECT_ROOT/gradlew"
            echo "GRADLE_BIN=$PROJECT_ROOT/gradlew" >> "$GITHUB_ENV"
            echo "Using the project's own Gradle wrapper." | tee -a "$LOG"
            exit 0
          fi
          echo "No gradlew in the project root; downloading Gradle $GRADLE_VERSION for the hosted runner." | tee -a "$LOG"
          gradle_home="$RUNNER_TEMP/gradle-dist"
          mkdir -p "$gradle_home"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$gradle_home/gradle.zip"
          unzip -q -o "$gradle_home/gradle.zip" -d "$gradle_home"
          gradle_bin="$gradle_home/gradle-${GRADLE_VERSION}/bin/gradle"
          chmod +x "$gradle_bin"
          echo "GRADLE_BIN=$gradle_bin" >> "$GITHUB_ENV"
          ( cd "$PROJECT_ROOT" && "$gradle_bin" wrapper --gradle-version "$GRADLE_VERSION" ) >>"$LOG" 2>&1 || true
          echo "Gradle $GRADLE_VERSION is ready at $gradle_bin." | tee -a "$LOG"
      - name: Set up Node.js
        if: contains(fromJSON('["expo","react-native","capacitor","ionic","cordova","nativescript","bazel"]'), steps.inspect.outputs.project_type)
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.inspect.outputs.node_version }}
      - name: Set up Python for Android Python toolchains
        if: steps.inspect.outputs.project_type == 'kivy' || steps.inspect.outputs.project_type == 'beeware'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up .NET for Android
        if: steps.inspect.outputs.project_type == 'dotnet-android'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.inspect.outputs.dotnet_sdk }}
      - name: Install .NET Android workload
        if: steps.inspect.outputs.project_type == 'dotnet-android'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          dotnet workload install maui-android --skip-manifest-update 2>&1 | tee -a "$LOG" || {
            echo "maui-android workload install failed; retrying with android workload only." | tee -a "$LOG"
            dotnet workload install android --skip-manifest-update 2>&1 | tee -a "$LOG"
          }
      - name: Free disk space for large native builds
        if: contains(fromJSON('["flutter","dotnet-android","kivy","beeware"]'), steps.inspect.outputs.project_type)
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          echo "Free disk space before compilation:" | tee -a "$LOG"
          df -h "$GITHUB_WORKSPACE" | tee -a "$LOG"
          for unused_path in /usr/share/dotnet /opt/ghc /usr/local/share/powershell "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images"; do
            if [ -e "$unused_path" ]; then
              sudo rm -rf -- "$unused_path"
              echo "Removed unused hosted-runner component: $unused_path" | tee -a "$LOG"
            fi
          done
          echo "Available disk space after cleanup:" | tee -a "$LOG"
          df -h "$GITHUB_WORKSPACE" | tee -a "$LOG"
      - name: Set up Flutter
        if: steps.inspect.outputs.project_type == 'flutter' && steps.inspect.outputs.flutter_version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.inspect.outputs.flutter_version }}
          cache: true
      - name: Set up Flutter from the stable channel
        if: steps.inspect.outputs.project_type == 'flutter' && steps.inspect.outputs.flutter_version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Rust targets for Flutter native plugins
        if: steps.inspect.outputs.project_type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          if ! command -v rustup >/dev/null 2>&1; then
            if ! curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >>"$LOG" 2>&1; then
              echo "Rust toolchain could not be installed; only cargokit based plugins need it." | tee -a "$LOG"
              exit 0
            fi
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          if rustup target add armv7-linux-androideabi aarch64-linux-android >>"$LOG" 2>&1; then
            echo "Rust Android targets are installed for Flutter native plugins." | tee -a "$LOG"
          else
            echo "Rust Android targets were not installed; the Flutter build continues without them." | tee -a "$LOG"
          fi
      - name: Cache Android build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: editortrue-build-${{ runner.os }}-${{ hashFiles('project-source/**/pubspec.lock', 'project-source/**/Cargo.lock', 'project-source/**/gradle-wrapper.properties', 'project-source/**/package-lock.json', 'project-source/**/pnpm-lock.yaml', 'project-source/**/yarn.lock') }}
          restore-keys: |
            editortrue-build-${{ runner.os }}-
      - name: Install JavaScript dependencies
        if: contains(fromJSON('["expo","react-native","capacitor","ionic","cordova","nativescript"]'), steps.inspect.outputs.project_type)
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.inspect.outputs.project_root }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          TRY="$GITHUB_WORKSPACE/build-tools/try-build.sh"
          npm config set fund false --location=project >/dev/null 2>&1 || true
          npm config set audit false --location=project >/dev/null 2>&1 || true
          if [ -f pnpm-lock.yaml ]; then
            corepack enable >>"$LOG" 2>&1 || true
            package_manager="$(node -p "require('./package.json').packageManager || 'pnpm@9'" 2>/dev/null || echo 'pnpm@9')"
            case "$package_manager" in pnpm@*) ;; *) package_manager="pnpm@9" ;; esac
            corepack prepare "$package_manager" --activate >>"$LOG" 2>&1 || true
            bash "$TRY" "pnpm install" "pnpm install --frozen-lockfile" "pnpm install --no-frozen-lockfile" "pnpm install --no-frozen-lockfile --ignore-scripts"
          elif [ -f yarn.lock ]; then
            corepack enable >>"$LOG" 2>&1 || true
            package_manager="$(node -p "require('./package.json').packageManager || 'yarn@1.22.22'" 2>/dev/null || echo 'yarn@1.22.22')"
            case "$package_manager" in yarn@*) ;; *) package_manager="yarn@1.22.22" ;; esac
            corepack prepare "$package_manager" --activate >>"$LOG" 2>&1 || true
            case "$package_manager" in
              yarn@1.*) bash "$TRY" "yarn install" "yarn install --frozen-lockfile" "yarn install --network-timeout 600000" ;;
              *) bash "$TRY" "yarn install" "yarn install --immutable" "yarn install" ;;
            esac
          elif [ -f package-lock.json ]; then
            bash "$TRY" "npm ci" "npm ci --no-audit --no-fund" "npm install --no-audit --no-fund"
          else
            bash "$TRY" "npm install" "npm install --no-audit --no-fund" "npm install --no-audit --no-fund --legacy-peer-deps"
          fi
      - name: Wrap legacy ADT project in a Gradle build
        if: steps.inspect.outputs.project_type == 'adt'
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.inspect.outputs.project_root }}
          ANDROID_API: ${{ steps.inspect.outputs.android_api }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          namespace="$(grep -oE 'package="[^"]+"' AndroidManifest.xml | head -n 1 | sed -E 's/.*="([^"]+)".*/\1/')"
          if [ -z "$namespace" ]; then namespace="com.example.legacyapp"; fi
          min_sdk="$(grep -oE 'android:minSdkVersion="[0-9]+"' AndroidManifest.xml | grep -oE '[0-9]+' | head -n 1)"
          if [ -z "$min_sdk" ]; then min_sdk="21"; fi
          if [ "$min_sdk" -lt 21 ]; then min_sdk="21"; fi
          echo "Generating a Gradle project around the legacy manifest (namespace $namespace, minSdk $min_sdk)." | tee -a "$LOG"
          sed -E -i 's/ package="[^"]+"//; s/ android:(min|target)SdkVersion="[0-9]+"//g' AndroidManifest.xml
          mkdir -p app
          cat > settings.gradle <<EOF
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'legacy-adapter'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
            namespace '$namespace'
            compileSdk $ANDROID_API
            defaultConfig {
              applicationId '$namespace'
              minSdk $min_sdk
              targetSdk $ANDROID_API
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            buildTypes {
              debug { }
              release { minifyEnabled false }
            }
            sourceSets {
              main {
                manifest.srcFile '../AndroidManifest.xml'
                java.srcDirs = ['../src', '../gen']
                res.srcDirs = ['../res']
                assets.srcDirs = ['../assets']
                jniLibs.srcDirs = ['../libs']
              }
            }
          }
          EOF
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" > local.properties
          echo "Legacy ADT adapter project is ready." | tee -a "$LOG"
      - name: Build Flutter APK
        if: steps.inspect.outputs.project_type == 'flutter'
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.inspect.outputs.project_root }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          TRY="$GITHUB_WORKSPACE/build-tools/try-build.sh"
          flutter --version >>"$LOG" 2>&1 || true
          if [ ! -f android/gradlew ]; then
            echo "The archive has no android/ host project; generating one with flutter create." | tee -a "$LOG"
            bash "$TRY" "flutter create" "flutter create --platforms=android ." "flutter create --platforms=android --overwrite ."
          fi
          bash "$TRY" "flutter pub get" "flutter pub get" "flutter pub get --no-precompile"
          echo "Preflight: checking Dart sources before the APK compilation." | tee -a "$LOG"
          set +e
          flutter analyze --no-pub 2>&1 | tee -a "$LOG"
          analyze_status=${PIPESTATUS[0]}
