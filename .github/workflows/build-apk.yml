            "briefcase create android --no-input && briefcase build android" \
            "briefcase create android && briefcase build android" \
            "briefcase package android --adhoc --no-input"
      - name: Build Bazel Android APK
        if: steps.inspect.outputs.project_type == 'bazel'
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.inspect.outputs.project_root }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          BAZEL_BIN=""
          if command -v bazel >/dev/null 2>&1; then
            BAZEL_BIN="$(command -v bazel)"
          else
            curl -fsSLo "$RUNNER_TEMP/bazelisk" https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
            chmod +x "$RUNNER_TEMP/bazelisk"
            BAZEL_BIN="$RUNNER_TEMP/bazelisk"
          fi
          echo "Building with Bazel at $BAZEL_BIN" | tee -a "$LOG"
          bash "$GITHUB_WORKSPACE/build-tools/try-build.sh" "bazel android" \
            "$BAZEL_BIN build //... --keep_going" \
            "$BAZEL_BIN build //... "
      - name: Explain engine projects that must be exported first
        if: contains(fromJSON('["unity-source","godot-source","unreal-source"]'), steps.inspect.outputs.project_type)
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          {
            echo "This archive is an engine editor project, not a buildable Android project."
            echo "Unity, Godot and Unreal compile Android output only through their own"
            echo "editor export step, which needs the editor, its Android modules and the"
            echo "engine licence on the machine. Export the project to an Android Gradle"
            echo "project, then upload that exported folder as the ZIP."
          } | tee -a "$LOG"
          exit 1
      - name: Collect installable APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.inspect.outputs.project_root }}"
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          mapfile -d '' -t APK_FILES < <(find "$ROOT" "$GITHUB_WORKSPACE/bazel-bin" -type f -name '*.apk' \
            -not -path '*/intermediates/*' -not -path '*/.gradle/*' -not -path '*/tmp/*' \
            -not -name '*-unaligned.apk' -not -name '*-dontinstall.apk' \
            -print0 2>/dev/null | sort -z)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "Build completed but no APK was found under $ROOT." | tee -a "$LOG"
            exit 1
          fi
          index=1
          for apk in "${APK_FILES[@]}"; do
            base="$(basename "$apk")"
            cp "$apk" "$GITHUB_WORKSPACE/build-result/${index}-${base}"
            echo "Collected APK: $apk" | tee -a "$LOG"
            index=$((index + 1))
          done
      - name: Summarize build attempts
        if: always()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build-result/build.log"
          mkdir -p "$GITHUB_WORKSPACE/build-result"
          {
            echo ""
            echo "=== Build attempt summary ==="
            if [ -s "$GITHUB_WORKSPACE/build-result/successful-attempts.txt" ]; then
              echo "Succeeded:"
              cat "$GITHUB_WORKSPACE/build-result/successful-attempts.txt"
            else
              echo "No build attempt succeeded; the first failure in this log is the real cause."
            fi
          } >> "$LOG" 2>/dev/null || true
      - name: Save build log even when compilation fails
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-result-${{ inputs.release_tag }}
          path: build-result/
          if-no-files-found: warn
          retention-days: 1

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs and build log
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: build-result-${{ inputs.release_tag }}
          path: build-result
      - name: Attach build results and remove the uploaded source ZIP
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ inputs.release_tag }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build-result/*.apk)
          for file in build-result/build.log build-result/project-type.txt; do
            if [ -f "$file" ]; then files+=("$file"); fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            gh release upload "$BUILD_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release delete-asset "$BUILD_TAG" project.zip --repo "$GITHUB_REPOSITORY" --yes || true
